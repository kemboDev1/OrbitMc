<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171926"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="orbit" x1="8" y1="50" x2="56" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5b2e"/>
      <stop offset="55%" stop-color="#ff944d"/>
      <stop offset="100%" stop-color="#8f7dff"/>
    </linearGradient>
    <linearGradient id="core" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7847"/>
      <stop offset="100%" stop-color="#ff4924"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="14.75" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <!-- Back half of orbital ring -->
  <g transform="rotate(-26 32 32)">
    <path d="M 8 32 A 24 10.5 0 0 1 56 32" fill="none" stroke="url(#orbit)" stroke-width="4.2" stroke-linecap="round" opacity="0.48"/>
  </g>
  <!-- Planet speech-orb core -->
  <path d="M 32 18 C 40.284 18 47 24.268 47 32 C 47 39.732 40.284 46 32 46 C 29.52 46 27.18 45.43 25.12 44.43 L 18.8 46.4 L 20.65 40.55 C 18.38 38.24 17 35.26 17 32 C 17 24.268 23.716 18 32 18 Z" fill="url(#core)"/>
  <!-- Inner signal dots -->
  <circle cx="26.5" cy="32" r="2.2" fill="#fff7f2"/>
  <circle cx="32.5" cy="32" r="2.2" fill="#fff7f2"/>
  <circle cx="38.5" cy="32" r="2.2" fill="#fff7f2"/>
  <!-- Front half of orbital ring -->
  <g transform="rotate(-26 32 32)">
    <path d="M 56 32 A 24 10.5 0 0 1 8 32" fill="none" stroke="url(#orbit)" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- Orbiting satellite node -->
  <circle cx="49" cy="18.5" r="4.2" fill="#8f7dff" stroke="#0f1018" stroke-width="2"/>
